name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Cache Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-cache-pint-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-cache-pint-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run Pint
        run: vendor/bin/pint --test

  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Cache Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-cache-phpstan-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-cache-phpstan-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run PHPStan / Larastan
        run: vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=2G

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit

  tests:
    name: PHPUnit (PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '^9.16'
          - laravel: '12.*'
            testbench: '^10.12'
          - laravel: '13.*'
            testbench: '^11.3'
        exclude:
          # Laravel 13 requires PHP ^8.3; Composer cannot resolve 13.* on PHP 8.2.
          - php: '8.2'
            laravel: '13.*'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      # Laravel 11 is past its security-support window and has unpatched advisories,
      # which Composer blocks by default. Allow it here for compatibility testing only;
      # the separate audit job still runs against the supported dependency set.
      - name: Allow legacy Laravel 11 resolution for compatibility tests
        if: matrix.laravel == '11.*'
        run: composer config --json policy.advisories.block false

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

  lowest:
    name: Lowest deps (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-lowest-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-lowest-${{ matrix.php }}-

      - name: Allow legacy Laravel 11 resolution for lowest-deps tests
        run: composer config --json policy.advisories.block false

      - name: Install lowest stable dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
